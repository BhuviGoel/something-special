<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A question for Niharika 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--green:#1fbf75;--ink:#12404a;--pink:#ff8fb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  color:var(--ink);font-family:"Poppins","Trebuchet MS",sans-serif;text-align:center;overflow:hidden;
  background-color:#6fd3c4;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.75) 7px,transparent 8px),
    radial-gradient(circle,rgba(255,255,255,.75) 7px,transparent 8px),
    linear-gradient(135deg,#7fe0c4 0%,#6fd3d8 50%,#6db8ee 100%);
  background-size:56px 56px,56px 56px,100% 100%;
  background-position:0 0,28px 28px,0 0;
}

/* florals (behind everything) */
.fl{position:fixed;z-index:0;pointer-events:none;animation:sway 7s ease-in-out infinite alternate;translate:var(--px,0px) var(--py,0px);transition:translate .4s ease-out}
@keyframes sway{from{transform:rotate(-18deg) scale(.95)}to{transform:rotate(18deg) scale(1.06)}}
.hearts{position:fixed;inset:0;z-index:1;pointer-events:none;font-size:2rem;overflow:hidden}
.hearts span{position:absolute;transform:translate(-50%,-50%);animation:burst var(--t,1.4s) cubic-bezier(.1,.8,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r))}}

/* pages + white card (above the confetti) */
.page{position:relative;z-index:2;display:none;min-height:100%;align-items:center;justify-content:center;padding:24px;animation:pop .6s ease}
.page.active{display:flex}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:none}}
.card{
  width:100%;max-width:560px;background:#fff;border-radius:32px;padding:40px 28px;
  display:flex;flex-direction:column;align-items:center;gap:22px;
  box-shadow:0 14px 0 rgba(18,64,74,.15),0 20px 40px rgba(18,64,74,.2);
  outline:3px dashed #9fe3cf;outline-offset:-14px;
}
h1{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:clamp(1.5rem,6vw,2.3rem);margin:0;line-height:1.5}
p{font-size:clamp(1.15rem,4.5vw,1.6rem);margin:0;line-height:1.5}
.prom{font-size:clamp(3.4rem,19vw,7.5rem);letter-spacing:.12em;font-weight:900;color:var(--green);text-shadow:4px 4px 0 #bfe3ff;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.07)}}

button{font:inherit;font-weight:700;font-size:1.15rem;padding:14px 30px;border:none;border-radius:999px;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 6px 0 #138a54;transition:transform .15s}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(3px);box-shadow:0 3px 0 #138a54}
button.alt{background:#d9f0ff;color:var(--ink);box-shadow:0 6px 0 #8fc4ee}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:70px}
#no{transition:left .25s ease,top .25s ease;z-index:5}

/* cursor sparkles */
.sp{position:fixed;z-index:9;pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 0 6px rgba(18,64,74,.55);animation:spark .9s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + 40px)) scale(.2) rotate(180deg)}}
</style>
</head>
<body>

<!-- flower shapes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flower" viewBox="-70 -70 140 140">
    <g fill="#3fb98a">
      <ellipse cx="0" cy="-52" rx="9" ry="20" transform="rotate(30)"/>
      <ellipse cx="0" cy="-52" rx="9" ry="20" transform="rotate(150)"/>
      <ellipse cx="0" cy="-52" rx="9" ry="20" transform="rotate(270)"/>
    </g>
    <g fill="currentColor" stroke="#fff" stroke-width="2">
      <ellipse cx="0" cy="-26" rx="15" ry="26"/>
      <ellipse cx="0" cy="-26" rx="15" ry="26" transform="rotate(60)"/>
      <ellipse cx="0" cy="-26" rx="15" ry="26" transform="rotate(120)"/>
      <ellipse cx="0" cy="-26" rx="15" ry="26" transform="rotate(180)"/>
      <ellipse cx="0" cy="-26" rx="15" ry="26" transform="rotate(240)"/>
      <ellipse cx="0" cy="-26" rx="15" ry="26" transform="rotate(300)"/>
    </g>
    <circle r="13" fill="#ffd95a" stroke="#fff" stroke-width="3"/>
    <circle r="4" cx="-4" cy="-3" fill="#ffb300"/><circle r="4" cx="5" cy="3" fill="#ffb300"/>
  </symbol>
</svg>

<svg class="fl" style="top:-50px;left:-50px;width:clamp(150px,28vw,300px);color:#ff8fb8"><use href="#flower"/></svg>
<svg class="fl" style="top:6%;left:clamp(90px,17vw,230px);width:clamp(60px,10vw,110px);color:#fff;animation-delay:-3s"><use href="#flower"/></svg>
<svg class="fl" style="top:-40px;right:-40px;width:clamp(130px,24vw,260px);color:#ffc2a8;animation-delay:-2s"><use href="#flower"/></svg>
<svg class="fl" style="top:30%;right:-30px;width:clamp(70px,11vw,120px);color:#cdb4ff;animation-delay:-5s"><use href="#flower"/></svg>
<svg class="fl" style="bottom:-50px;right:-50px;width:clamp(160px,30vw,320px);color:#ff8fb8;animation-delay:-4s"><use href="#flower"/></svg>
<svg class="fl" style="bottom:8%;right:clamp(90px,17vw,230px);width:clamp(55px,9vw,100px);color:#fff;animation-delay:-1s"><use href="#flower"/></svg>
<svg class="fl" style="bottom:-40px;left:-40px;width:clamp(140px,26vw,280px);color:#cdb4ff;animation-delay:-6s"><use href="#flower"/></svg>
<svg class="fl" style="bottom:32%;left:-25px;width:clamp(65px,10vw,110px);color:#ffc2a8;animation-delay:-7s"><use href="#flower"/></svg>

<div class="hearts" id="hearts"></div>

<div class="page active" id="p1"><div class="card">
  <h1>hey norika, nihu bro, chittu, nirahika, my baby boo 💖</h1>
  <button onclick="go('p2')">hello bhuburu</button>
</div></div>

<div class="page" id="p2"><div class="card">
  <p>do you know what's coming up? 👀</p>
  <div class="row">
    <button onclick="go('p3')">yes</button>
    <button class="alt" onclick="go('p2b');setTimeout(()=>go('p3'),2200)">no</button>
  </div>
</div></div>

<div class="page" id="p2b"><div class="card">
  <h1>it's prom time, silly! 🎀</h1>
</div></div>

<div class="page" id="p3"><div class="card">
  <p>i think it's time for me to ask you to come to the dance with me. 💃</p>
  <button onclick="go('p4')">okay, and.....</button>
</div></div>

<div class="page" id="p4"><div class="card">
  <p>well then,<br><span style="font-family:Pacifico,cursive">my dearest niharika,</span></p>
  <div class="prom">PROM?</div>
  <div class="row">
    <button id="yes" onclick="go('p5');confetti()">yes 💕</button>
    <button id="no" class="alt">no</button>
  </div>
</div></div>

<div class="page" id="p5"><div class="card">
  <h1>i knew it, i love you heheh 🥹💖</h1>
</div></div>

<script>
function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// The "no" button runs away and can't be clicked
const no=document.getElementById('no');
function runAway(e){
  if(e){e.preventDefault();e.stopPropagation();}
  no.style.position='fixed';
  const m=20, w=no.offsetWidth, h=no.offsetHeight;
  no.style.left=m+Math.random()*(window.innerWidth-w-2*m)+'px';
  no.style.top=m+Math.random()*(window.innerHeight-h-2*m)+'px';
}
['pointerenter','pointerdown','touchstart','mousedown','click','focus'].forEach(ev=>
  no.addEventListener(ev,runAway,{passive:false}));
document.addEventListener('pointermove',e=>{
  if(!document.getElementById('p4').classList.contains('active'))return;
  const r=no.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<90)runAway();
});

// Sparkle trail + floral parallax that follow the cursor
const flowers=[...document.querySelectorAll('.fl')];
let last=0,lx=0,ly=0;
function sparkle(x,y){
  const s=document.createElement('span');
  s.className='sp';
  s.textContent=['✦','✧','✨','★'][Math.floor(Math.random()*4)];
  s.style.left=x+'px';s.style.top=y+'px';
  s.style.color=['#fff','#ffd95a','#ff8fb8','#1fbf75','#6db8ee'][Math.floor(Math.random()*5)];
  s.style.setProperty('--dx',(Math.random()*40-20)+'px');
  s.style.fontSize=(12+Math.random()*16)+'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),900);
}
document.addEventListener('pointermove',e=>{
  const nx=e.clientX/innerWidth-.5, ny=e.clientY/innerHeight-.5;
  flowers.forEach((f,i)=>{const d=18+(i%3)*14;f.style.setProperty('--px',(-nx*d)+'px');f.style.setProperty('--py',(-ny*d)+'px');});
  const now=performance.now();
  if(now-last>35&&Math.hypot(e.clientX-lx,e.clientY-ly)>12){last=now;lx=e.clientX;ly=e.clientY;sparkle(e.clientX,e.clientY);}
});

// Sparkler-style bursts after "yes" (behind the white card)
function burst(cx,cy){
  const box=document.getElementById('hearts');
  const n=14+Math.floor(Math.random()*8);
  const set=['💚','💙','💚','💖','💚','💙','✨','⭐'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.textContent=set[Math.floor(Math.random()*set.length)];
    const a=Math.random()*Math.PI*2, d=60+Math.random()*140;
    s.style.left=cx+'px';s.style.top=cy+'px';
    s.style.fontSize=(1+Math.random()*1.3)+'rem';
    s.style.setProperty('--x',Math.cos(a)*d+'px');
    s.style.setProperty('--y',Math.sin(a)*d+'px');
    s.style.setProperty('--r',(Math.random()*360-180)+'deg');
    s.style.setProperty('--t',(1+Math.random()*.9)+'s');
    box.appendChild(s);
    setTimeout(()=>s.remove(),2000);
  }
}
function confetti(){
  for(let i=0;i<14;i++){
    setTimeout(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight),i*350+Math.random()*250);
  }
}
</script>
</body>
</html>
